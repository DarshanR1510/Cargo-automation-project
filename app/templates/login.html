{% extends "base.html" %}
{% block title %}Log in · Cargo QA Lab{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Log in</h1>
  {% if error %}<div class="alert error" role="alert" data-testid="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <div style="margin-bottom:12px;">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div style="margin-bottom:16px;">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Log in</button>
  </form>
  <p class="muted" style="margin-top:16px;font-size:13px;">Test accounts are listed in the README.</p>
</div>
{% endblock %}
